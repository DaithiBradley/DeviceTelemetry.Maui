name: Publish NuGet Package

on:
  push:
    branches: [ "main", "master", "develop" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  PROJECT_PATH: 'DeviceTelemetry.Maui.csproj'
  SOLUTION_PATH: 'DeviceTelemetry.Maui.sln'

jobs:
  build-and-publish:
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget
      
      - name: Configure NuGet authentication
        run: |
          $pat = "${{ secrets.GITHUB_TOKEN }}"
          $feed = "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          dotnet nuget add source $feed --name github --username ${{ github.repository_owner }} --password $pat --store-password-in-clear-text
        shell: pwsh
      
      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}
      
      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_PATH }} -c Release --no-restore
      
      - name: Pack NuGet Package
        run: |
          if (Test-Path "./artifacts") { Remove-Item -Recurse -Force "./artifacts" }
          New-Item -ItemType Directory -Path "./artifacts" -Force | Out-Null
          
          $version = ""
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $version = "${{ github.ref_name }}".Substring(1)
          } else {
            # Get version from csproj if not a tag
            $csprojContent = Get-Content ${{ env.PROJECT_PATH }} | Out-String
            $version = ([xml]$csprojContent).Project.PropertyGroup.Version
            $buildNumber = "${{ github.run_number }}"
            $version = "$version-ci.$buildNumber"
          }
          
          dotnet pack ${{ env.PROJECT_PATH }} -c Release --no-build -o ./artifacts /p:Version=$version /p:PackageProjectUrl="https://github.com/${{ github.repository }}" /p:RepositoryUrl="https://github.com/${{ github.repository }}" /p:RepositoryType="git"
          
          # Verify package was created
          Write-Host "Packages created:"
          Get-ChildItem -Path "./artifacts" -Filter "*.nupkg" | ForEach-Object { Write-Host "  - $($_.FullName)" }
        shell: pwsh

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg
          retention-days: 30

      - name: Publish to GitHub Packages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') || startsWith(github.ref, 'refs/tags/v')
        run: |
          $packageFiles = Get-ChildItem -Path "./artifacts" -Filter "*.nupkg"
          if ($packageFiles.Count -eq 0) {
            Write-Host "No .nupkg files found in ./artifacts directory"
            Get-ChildItem -Path "./artifacts" -Recurse | ForEach-Object { Write-Host "Found: $($_.FullName)" }
            exit 1
          }
          foreach ($package in $packageFiles) {
            Write-Host "Publishing: $($package.FullName)"
            dotnet nuget push $package.FullName --api-key ${{ secrets.GITHUB_TOKEN }} --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate
          }
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to NuGet.org
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        run: |
          $packageFiles = Get-ChildItem -Path "./artifacts" -Filter "*.nupkg"
          if ($packageFiles.Count -eq 0) {
            Write-Host "No .nupkg files found in ./artifacts directory"
            Get-ChildItem -Path "./artifacts" -Recurse | ForEach-Object { Write-Host "Found: $($_.FullName)" }
            exit 1
          }
          foreach ($package in $packageFiles) {
            Write-Host "Publishing to NuGet.org: $($package.FullName)"
            dotnet nuget push $package.FullName --api-key ${{ secrets.NUGET_API_KEY }} --source "https://api.nuget.org/v3/index.json" --skip-duplicate
          }
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
