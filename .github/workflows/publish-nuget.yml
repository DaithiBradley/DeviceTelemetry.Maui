name: Publish NuGet Package

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  PROJECT_PATH: 'DeviceTelemetry.Maui.csproj'
  SOLUTION_PATH: 'DeviceTelemetry.Maui.sln'

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget
      
      - name: Add GitHub NuGet source
        run: |
          dotnet nuget add source --username ${{ github.repository_owner }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
      
      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}
      
      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_PATH }} -c Release --no-restore
      
      - name: Pack NuGet Package
        run: |
          if (Test-Path "./artifacts") { Remove-Item -Recurse -Force "./artifacts" }
          New-Item -ItemType Directory -Path "./artifacts" | Out-Null
          
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $version = "${{ github.ref_name }}".Substring(1)
            dotnet pack ${{ env.PROJECT_PATH }} -c Release --no-build -o ./artifacts /p:Version=$version
          } else {
            dotnet pack ${{ env.PROJECT_PATH }} -c Release --no-build -o ./artifacts
          }
        shell: pwsh

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg
          retention-days: 30

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet nuget push ./artifacts/*.nupkg --api-key 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 --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate



