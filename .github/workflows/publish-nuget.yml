name: Build and publish

on:
  push:
    branches: [ "main", "master", "develop" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'DeviceTelemetry.Maui.csproj'
  SOLUTION_PATH: 'DeviceTelemetry.Maui.sln'

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workloads
        run: dotnet workload install maui-windows maui-android

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_PATH }} -c Release --no-restore

      - name: Run tests
        run: dotnet test ${{ env.SOLUTION_PATH }} -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Pack Windows and Android
        run: |
          if (Test-Path "./artifacts/windows") { Remove-Item -Recurse -Force "./artifacts/windows" }
          New-Item -ItemType Directory -Path "./artifacts/windows" -Force | Out-Null
          $version = "${{ github.ref_name }}"
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $version = $version.Substring(1)
          } else {
            $version = "1.2.0-ci.${{ github.run_number }}"
          }
          dotnet pack ${{ env.PROJECT_PATH }} -c Release --no-build -o ./artifacts/windows /p:Version=$version
        shell: pwsh

      - name: Upload Windows pack
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-windows
          path: ./artifacts/windows/*.nupkg
          retention-days: 14

  build-apple:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workloads
        run: dotnet workload install maui-ios maui-maccatalyst maui-android

      - name: Build iOS, Mac Catalyst, and Android
        run: dotnet build ${{ env.PROJECT_PATH }} -c Release

      - name: Pack Apple and Android
        run: |
          mkdir -p ./artifacts/apple
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${VERSION:1}"
          else
            VERSION="1.2.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          dotnet pack ${{ env.PROJECT_PATH }} -c Release --no-build -o ./artifacts/apple /p:Version="$VERSION"

      - name: Upload Apple pack
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-apple
          path: ./artifacts/apple/*.nupkg
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test-windows, build-apple]
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Download Windows pack
        uses: actions/download-artifact@v4
        with:
          name: nupkg-windows
          path: ./artifacts/windows

      - name: Download Apple pack
        uses: actions/download-artifact@v4
        with:
          name: nupkg-apple
          path: ./artifacts/apple

      - name: Merge nupkgs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $winPkg = Get-ChildItem ./artifacts/windows/*.nupkg | Select-Object -First 1
          $applePkg = Get-ChildItem ./artifacts/apple/*.nupkg | Select-Object -First 1
          if (-not $winPkg -or -not $applePkg) { throw "Missing nupkg artifacts to merge." }

          $work = Join-Path $env:RUNNER_TEMP "nupkg-merge"
          $winDir = Join-Path $work "win"
          $appleDir = Join-Path $work "apple"
          New-Item -ItemType Directory -Path $winDir, $appleDir, "./artifacts/merged" -Force | Out-Null

          Copy-Item $winPkg.FullName (Join-Path $work "win.zip")
          Copy-Item $applePkg.FullName (Join-Path $work "apple.zip")
          Expand-Archive (Join-Path $work "win.zip") -DestinationPath $winDir -Force
          Expand-Archive (Join-Path $work "apple.zip") -DestinationPath $appleDir -Force

          $appleLib = Join-Path $appleDir "lib"
          $winLib = Join-Path $winDir "lib"
          if (Test-Path $appleLib) {
            Copy-Item (Join-Path $appleLib "*") $winLib -Recurse -Force
          }

          $outZip = Join-Path $work $winPkg.Name.Replace(".nupkg", ".zip")
          if (Test-Path $outZip) { Remove-Item $outZip -Force }
          Compress-Archive -Path (Join-Path $winDir "*") -DestinationPath $outZip
          $outPkg = Join-Path "./artifacts/merged" $winPkg.Name
          Move-Item $outZip $outPkg -Force
          Write-Host "Merged package: $outPkg"

      - name: Publish to GitHub Packages
        run: |
          $package = Get-ChildItem -Path "./artifacts/merged" -Filter "*.nupkg" | Select-Object -First 1
          dotnet nuget push $package.FullName --api-key ${{ secrets.GITHUB_TOKEN }} --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to NuGet.org
        run: |
          $package = Get-ChildItem -Path "./artifacts/merged" -Filter "*.nupkg" | Select-Object -First 1
          dotnet nuget push $package.FullName --api-key ${{ secrets.NUGET_API_KEY }} --source "https://api.nuget.org/v3/index.json" --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Upload merged package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/merged/*.nupkg
          retention-days: 30
