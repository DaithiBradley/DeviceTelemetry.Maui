name: Publish NuGet Package

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  PROJECT_PATH: 'DeviceTelemetry.Maui.csproj'
  SOLUTION_PATH: 'DeviceTelemetry.Maui.sln'

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget
      
      - name: Configure NuGet authentication
        run: |
          $pat = "${{ secrets.GITHUB_TOKEN }}"
          $feed = "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          $bytes = [System.Text.Encoding]::UTF8.GetBytes("${env:GITHUB_REPOSITORY_OWNER}:$pat")
          $base64 = [System.Convert]::ToBase64String($bytes)
          $authHeader = "Basic $base64"
          dotnet nuget add source $feed --name github --username ${{ github.repository_owner }} --password $pat --store-password-in-clear-text
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      
      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}
      
      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_PATH }} -c Release --no-restore
      
      - name: Pack NuGet Package
        run: |
          if (Test-Path "./artifacts") { Remove-Item -Recurse -Force "./artifacts" }
          New-Item -ItemType Directory -Path "./artifacts" | Out-Null
          
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $version = "${{ github.ref_name }}".Substring(1)
            dotnet pack ${{ env.PROJECT_PATH }} -c Release --no-build -o ./artifacts /p:Version=$version
          } else {
            dotnet pack ${{ env.PROJECT_PATH }} -c Release --no-build -o ./artifacts
          }
        shell: pwsh

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg
          retention-days: 30

      - name: Publish to GitHub Packages
        if: github.event_name != 'pull_request'
        run: |
          Write-Host "Publishing package to GitHub Packages..."
          $packageFile = Get-ChildItem -Path "./artifacts/*.nupkg" | Select-Object -First 1
          Write-Host "Package file: $($packageFile.FullName)"
          Write-Host "Package name: $($packageFile.Name)"
          Write-Host "Repository owner: ${{ github.repository_owner }}"
          Write-Host "Repository: ${{ github.repository }}"
          
          # Ensure the source exists
          dotnet nuget list source | Out-Host
          
          # Push the package
          dotnet nuget push $packageFile.FullName `
            --api-key ${{ secrets.GITHUB_TOKEN }} `
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            --skip-duplicate `
            --no-symbols
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



